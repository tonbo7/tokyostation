<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#0071BC">
<title>東京ステーションガイド｜路線図から、いちばん良い移動手段へ</title>
<meta name="description" content="東京23区の全鉄道・全駅を路線図から1タップ。徒歩・自転車・バス・電車・タクシーを時間と費用で並べて比べられる移動ダッシュボード。終電を逃した深夜にも使えます。">
<link rel="stylesheet" href="assets/app.css">
<meta name="description" content="東京23区669駅とスポット18,000件を、地図・スコア・ルート比較・おでかけプランで調べられる自由研究サイト。オープンデータだけで作りました。">
<meta name="theme-color" content="#00224A">
<meta property="og:type" content="website">
<meta property="og:title" content="東京ステーションガイド">
<meta property="og:description" content="東京23区669駅とスポット18,000件。地図・スコア・ルート比較・おでかけプラン。オープンデータだけで作った自由研究サイト。">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300224A'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle'%3E%F0%9F%9A%89%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="app">
  <header class="hdr">
    <div class="hdr__mark"><i></i><span>東京ステーションガイド<small id="statline">読み込み中…</small></span></div>
    <div class="hdr__search">
      <span class="ic">🔍</span>
      <input id="q" type="search" placeholder="駅・地名・建物・郵便番号（スペースでAND）" autocomplete="off"
             aria-label="駅を検索" enterkeyhint="search">
      <div id="sug" class="sug" role="listbox"></div>
    </div>
    <button id="btn-hub" class="hdr__btn" type="button">中村橋</button>
    <button id="btn-plan" class="hdr__btn hdr__btn--plan" type="button" aria-label="おでかけプラン">🧳</button>
    <button id="btn-live" class="hdr__btn hdr__btn--live" type="button" aria-label="いまの状況（運行情報・バス・シェアサイクル）" title="いまの状況">🚦</button>
    <button id="btn-set" class="hdr__btn" type="button" aria-label="設定">⚙️</button>
  </header>

  <div id="tripbar" class="tripbar" aria-label="出発地・出発時刻・提案の攻めかた"></div>
  <div id="t-status" class="tb__status" role="status"></div>

  <div id="loadbar" class="loadbar"></div>
  <div id="boot-error" class="booterr" hidden>
    <b>データを読み込めませんでした</b>
    <p>通信が不安定か、ファイルが見つかりません。ページを再読み込みしてみてください。</p>
    <button onclick="location.reload()">再読み込み</button>
  </div>
  <div id="navbar" class="navbar" hidden></div>
  <div class="mapwrap">
    <svg id="map" role="img" aria-label="東京23区とその周辺の鉄道路線図"></svg>
    <div class="hint">駅をタップで詳細。ドラッグで移動、ピンチで拡大。<span id="zlevel">全体</span></div>
    <div class="zoombar">
      <button id="zin"  type="button" aria-label="拡大">＋</button>
      <button id="zout" type="button" aria-label="縮小">−</button>
      <button id="zfit" class="sm" type="button" aria-label="全体表示">全体</button>
      <button id="zhub" class="sm" type="button" aria-label="中村橋へ">中心</button>
    </div>
    <div id="linepop" class="linepop" role="tooltip"></div>
    <div class="poicount">📍 <span id="poicount">-</span></div>
    <div id="quickbar" class="quickbar"></div>
    <div id="heatlegend" class="heatlegend" hidden></div>
  </div>
  <div id="linerail" class="linerail" aria-label="路線とスポットを選ぶ"></div>
  <div id="poipop" class="poipop" role="tooltip"></div>

  <nav id="chips" class="chips" aria-label="表示フィルタ"></nav>
</div>

<div id="hovercard" class="card hovercard" role="dialog" aria-label="駅の詳細"></div>
<div id="scrim" class="scrim"></div>
<div id="sheet" class="card sheet" role="dialog" aria-label="駅の詳細" aria-modal="false">
  <div id="grab" class="sheet__grab"><i></i></div>
  <div class="card__scroll"></div>
</div>

<!-- ▼ 本体 -->
<script src="assets/app.js"></script>

<!-- ▼ データ：路線を増やす＝ tools/build_network.py を再実行するだけ -->

<!-- ▼ ルート推定エンジンとプランナーUI -->
<script src="assets/score.js"></script>
<script src="assets/planner.js"></script>
<script src="assets/plannerui.js"></script>
<script src="assets/lines_ui.js"></script>
<script src="assets/basemap.js"></script>
<script src="assets/search.js"></script>
<script src="assets/nav.js"></script>
<script src="assets/plan.js"></script>
<script src="assets/logbook.js"></script>
<script src="assets/geohelp.js"></script>
<!-- ▼ いまの状況（ODPT 運行情報・バス・シェアサイクル）。API キーはここにも他のファイルにも書かない -->
<script src="assets/live.js"></script>
<!-- ▼ 歩行空間・構内（ほこナビ）。data/indoor.js があるときだけ動く -->
<script src="assets/walk.js"></script>
<script src="assets/loader.js"></script>

<script>RG.startApp();</script>
</body>
</html>
